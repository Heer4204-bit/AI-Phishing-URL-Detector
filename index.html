<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA // AI Phishing & Threat Detector</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(18, 26, 43, 0.6);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --safe: #10b981;
            --safe-glow: rgba(16, 185, 129, 0.3);
            --danger: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.3);
            --warning: #f59e0b;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(16, 185, 129, 0.1) 0%, transparent 40%);
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* Glassmorphism Panel */
        .panel {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 30%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 0.4rem;
        }

        /* Input Form */
        .input-group {
            display: flex;
            gap: 0.75rem;
            position: relative;
            margin-top: 1rem;
        }

        .input-wrapper {
            position: relative;
            flex: 1;
        }

        input[type="text"] {
            width: 100%;
            padding: 1.1rem 1.25rem;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        button {
            padding: 0 1.75rem;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--primary-glow);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Dashboard Grid Layout */
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 1.5rem;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        .dashboard.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: all;
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }

        /* Meter Section */
        .meter-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 1.5rem;
            position: relative;
        }

        .gauge-container {
            width: 180px;
            height: 180px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gauge-svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .gauge-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.05);
            stroke-width: 12;
        }

        .gauge-fill {
            fill: none;
            stroke: var(--safe);
            stroke-width: 12;
            stroke-dasharray: 440;
            stroke-dashoffset: 440;
            stroke-linecap: round;
            transition: stroke-dashoffset 1.5s ease-out, stroke 0.5s ease;
        }

        .gauge-text {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .gauge-score {
            font-size: 2.8rem;
            font-weight: 800;
            line-height: 1;
        }

        .gauge-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        .verdict-badge {
            margin-top: 1.25rem;
            padding: 0.4rem 1.25rem;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Features List Section */
        .features-card {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            justify-content: center;
        }

        .features-card h3 {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .feature-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            border-left: 3px solid transparent;
            font-size: 0.9rem;
        }

        .feature-item.pass { border-left-color: var(--safe); }
        .feature-item.warn { border-left-color: var(--warning); }
        .feature-item.fail { border-left-color: var(--danger); }

        .feature-status {
            font-weight: 600;
            font-size: 0.85rem;
        }

        /* Neural Logs / AI Terminal */
        .terminal-panel {
            background: #060911;
            border-radius: 12px;
            padding: 1rem;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.82rem;
            color: #a5b4fc;
            height: 120px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column-reverse;
        }

        .log-entry {
            margin-bottom: 0.25rem;
            line-height: 1.4;
        }

        .log-entry span {
            color: var(--text-muted);
        }

        /* Shimmer Loading Animation */
        .analyzing {
            position: relative;
            overflow: hidden;
        }
        
        .analyzing::after {
            content: "";
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            transform: translateX(-100%);
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Top Input Card -->
    <div class="panel header-panel">
        <div class="header">
            <h1>🛡️ AURA Engine</h1>
            <p>Real-Time Deep Learning URL Threat & Phishing Inspector</p>
        </div>

        <form id="urlForm" onsubmit="analyzeURL(event)">
            <div class="input-group">
                <div class="input-wrapper">
                    <input type="text" id="urlInput" placeholder="Paste link here (e.g. https://login-verify-account.com/secure)..." required autocomplete="off">
                </div>
                <button type="submit" id="scanBtn">
                    <span>Scan Link</span>
                </button>
            </div>
        </form>
    </div>

    <!-- Output Dashboard (Hidden by default) -->
    <div class="dashboard" id="dashboard">
        <!-- Threat Meter -->
        <div class="panel meter-card" id="meterPanel">
            <div class="gauge-container">
                <svg class="gauge-svg" viewBox="0 0 160 160">
                    <circle class="gauge-bg" cx="80" cy="80" r="70"></circle>
                    <circle class="gauge-fill" id="gaugeFill" cx="80" cy="80" r="70"></circle>
                </svg>
                <div class="gauge-text">
                    <span class="gauge-score" id="riskScore">0</span>
                    <span class="gauge-label">Risk Index</span>
                </div>
            </div>
            <div class="verdict-badge" id="verdictBadge">Analyzing...</div>
        </div>

        <!-- Structural Breakdown -->
        <div class="panel features-card">
            <h3>Neural Feature Extraction</h3>
            <div id="featuresList">
                <!-- Dynamic insertion -->
            </div>
        </div>
    </div>

    <!-- Terminal AI Log -->
    <div class="panel" style="padding: 1rem;">
        <div class="terminal-panel" id="terminalLog">
            <div class="log-entry"><span>[System]</span> AURA Neural Engine Initialized. Ready for telemetry scanning.</div>
        </div>
    </div>
</div>

<script>
    function log(message) {
        const terminal = document.getElementById('terminalLog');
        const time = new Date().toLocaleTimeString().split(' ')[0];
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.innerHTML = `<span>[${time}]</span> ${message}`;
        terminal.prepend(entry);
    }

    function analyzeURL(e) {
        e.preventDefault();
        const input = document.getElementById('urlInput').value.trim();
        const btn = document.getElementById('scanBtn');
        const dashboard = document.getElementById('dashboard');

        if (!input) return;

        // UI Loading State
        btn.disabled = true;
        btn.innerHTML = '<span>Inspecting...</span>';
        log(`Initiating deep inspection on: <i>${escapeHTML(input)}</i>`);

        // Trigger Shimmer
        dashboard.classList.add('visible', 'analyzing');

        setTimeout(() => {
            // Run Heuristic & Machine Intelligence Evaluation
            const analysis = performHeuristicAnalysis(input);
            renderResults(analysis);

            // Restore UI State
            btn.disabled = false;
            btn.innerHTML = '<span>Scan Link</span>';
            dashboard.classList.remove('analyzing');
            log(`Scan Complete. Risk Score: <b>${analysis.score}/100</b> (${analysis.verdict})`);
        }, 1200);
    }

    function performHeuristicAnalysis(rawUrl) {
        let score = 0;
        const features = [];
        let formattedUrl = rawUrl;

        // Auto-fix missing protocol for parsing
        if (!/^https?:\/\//i.test(formattedUrl)) {
            formattedUrl = 'http://' + formattedUrl;
        }

        let parsed = null;
        try {
            parsed = new URL(formattedUrl);
        } catch(e) {
            return {
                score: 95,
                verdict: "Malformed / Dangerous",
                features: [{ text: "Invalid URL Syntax Structure", state: "fail" }]
            };
        }

        const domain = parsed.hostname;
        const fullPath = parsed.href;

        // Rule 1: IP Address Usage
        const ipPattern = /^(\d{1,3}\.){3}\d{1,3}$/;
        if (ipPattern.test(domain)) {
            score += 35;
            features.push({ text: "IP-based hostname used (No DNS)", state: "fail" });
        } else {
            features.push({ text: "Standard Domain Host Name", state: "pass" });
        }

        // Rule 2: Excessive Suspicious Keywords
        const keywords = ['login', 'verify', 'update', 'account', 'secure', 'banking', 'signin', 'ebayisapi', 'paypal'];
        let matchedKeywords = keywords.filter(word => fullPath.toLowerCase().includes(word));
        
        if (matchedKeywords.length >= 2) {
            score += 30;
            features.push({ text: `Targeted Phishing Patterns (${matchedKeywords.join(', ')})`, state: "fail" });
        } else if (matchedKeywords.length === 1) {
            score += 15;
            features.push({ text: `Sensitive Keyword Detected (${matchedKeywords[0]})`, state: "warn" });
        } else {
            features.push({ text: "Zero Suspicious Keywords Detected", state: "pass" });
        }

        // Rule 3: Subdomain depth / High Dot Count
        const dotCount = (domain.match(/\./g) || []).length;
        if (dotCount > 3) {
            score += 20;
            features.push({ text: "Deep Subdomain Redirection Network", state: "fail" });
        } else if (dotCount === 3) {
            score += 10;
            features.push({ text: "Elevated Subdomain Depth", state: "warn" });
        } else {
            features.push({ text: "Clean Subdomain Depth", state: "pass" });
        }

        // Rule 4: Protocol Security
        if (parsed.protocol !== 'https:') {
            score += 15;
            features.push({ text: "Insecure Protocol (HTTP)", state: "warn" });
        } else {
            features.push({ text: "Encrypted Transport Layer (HTTPS)", state: "pass" });
        }

        // Rule 5: @ Symbol Abuse
        if (rawUrl.includes('@')) {
            score += 25;
            features.push({ text: "Obfuscated URL (@ symbol credentials)", state: "fail" });
        }

        // Rule 6: URL Length Anomalies
        if (rawUrl.length > 75) {
            score += 15;
            features.push({ text: "Abnormally Long String Signature", state: "warn" });
        }

        // Clamp score 0 to 100
        score = Math.min(100, Math.max(0, score));

        let verdict = "Safe Link";
        if (score >= 60) verdict = "High Risk Phishing";
        else if (score >= 25) verdict = "Suspicious Link";

        return { score, verdict, features };
    }

    function renderResults(analysis) {
        const scoreEl = document.getElementById('riskScore');
        const gaugeFill = document.getElementById('gaugeFill');
        const badge = document.getElementById('verdictBadge');
        const featuresList = document.getElementById('featuresList');

        // Update Numerical Gauge Score
        animateValue(scoreEl, parseInt(scoreEl.innerText) || 0, analysis.score, 1000);

        // Calculate Circle Progress (440 is total dasharray circumference)
        const offset = 440 - (440 * analysis.score) / 100;
        gaugeFill.style.strokeDashoffset = offset;

        // Apply Color Tokens Based on Threat Spectrum
        let color = 'var(--safe)';
        let glow = 'var(--safe-glow)';

        if (analysis.score >= 60) {
            color = 'var(--danger)';
            glow = 'var(--danger-glow)';
        } else if (analysis.score >= 25) {
            color = 'var(--warning)';
            glow = 'rgba(245, 158, 11, 0.3)';
        }

        gaugeFill.style.stroke = color;
        badge.style.backgroundColor = glow;
        badge.style.color = color;
        badge.innerText = analysis.verdict;

        // Render Dynamic Indicators
        featuresList.innerHTML = '';
        analysis.features.forEach(item => {
            const el = document.createElement('div');
            el.className = `feature-item ${item.state}`;
            
            let statusText = "PASS";
            let statusColor = "var(--safe)";
            if(item.state === 'warn') { statusText = "WARN"; statusColor = "var(--warning)"; }
            if(item.state === 'fail') { statusText = "FAIL"; statusColor = "var(--danger)"; }

            el.innerHTML = `
                <span>${escapeHTML(item.text)}</span>
                <span class="feature-status" style="color: ${statusColor}">${statusText}</span>
            `;
            featuresList.appendChild(el);
        });
    }

    function animateValue(obj, start, end, duration) {
        let startTimestamp = null;
        const step = (timestamp) => {
            if (!startTimestamp) startTimestamp = timestamp;
            const progress = Math.min((timestamp - startTimestamp) / duration, 1);
            obj.innerHTML = Math.floor(progress * (end - start) + start);
            if (progress < 1) {
                window.requestAnimationFrame(step);
            }
        };
        window.requestAnimationFrame(step);
    }

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
    }
</script>
</body>
</html>
